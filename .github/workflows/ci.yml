name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Syntax & Dependencies Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Runner Scripts Syntax
        run: node -c runner/*.js

      - name: Validate Workflow JSON Files
        run: node -e "const fs = require('fs'); fs.readdirSync('workflows').filter(f => f.endsWith('.json')).forEach(f => JSON.parse(fs.readFileSync('workflows/' + f, 'utf8')))"
